<!DOCTYPE html>

<html class="light" lang="es">

<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link

        rel="stylesheet" />
    <script id="tailwind-config">

                extend: {

                        "secondary-fixed": "#d6e3ff",

                        "on-secondary-container": "#56637b",

                        "primary-fixed-dim": "#ffb781",
                        "surface-variant": "#eedfe0",

                        "on-primary-fixed": "#2f1400",
                        "primary-fixed": "#ffdcc4",

                        "tertiary-fixed-dim": "#fab5af",
                        "outline-variant": "#d7c3b6",
                        "surface-bright": "#fff8f7",
                        "inverse-surface": "#372e2f",
                        "on-background": "#211a1b",
                        "on-tertiary-fixed": "#350f0d",
                        "primary-container": "#9f6332",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#52443a",
                        "background": "#fff8f7",
                        "outline": "#857469",
                        "secondary-fixed-dim": "#bac7e3",
                        "surface-container": "#f9eaeb",
                        "primary": "#824b1c",
                        "surface-container-highest": "#eedfe0",
                        "on-error": "#ffffff",
                        "surface-dim": "#e5d7d8",
                        "tertiary": "#7f4a46",
                        "secondary": "#525f77",
                        "error": "#ba1a1a",

                    "borderRadius": {

                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "container-max": "1280px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "unit": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "label-md": ["Inter"],
                        "display-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                }
            }
        }
    </script>
    <style>
        /* Custom styles that aren't pure utility classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Form inputs focus effect */
        .input-glow:focus {
            border-color: #824b1c;
            box-shadow: 0 0 0 3px rgba(130, 75, 28, 0.2);
            outline: none;
        }

        /* Tonal elevation hover effect */
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(130, 75, 28, 0.1), 0 4px 6px -4px rgba(130, 75, 28, 0.05);
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex overflow-hidden">
    <!-- SideNavBar -->
    <nav
        class="bg-surface dark:bg-inverse-surface shadow-sm h-screen w-64 fixed left-0 top-0 flex flex-col h-full py-gutter px-4 z-50">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-8 px-2">
            <div
                class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_library</span>
            </div>
            <div>
                <h1
                    class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">
                    Bibliotech</h1>
                <p class="font-label-md text-label-md text-secondary">Modernismo Académico</p>
            </div>
        </div>
        <!-- Navigation Links -->
        <ul class="flex-1 space-y-1">
            <li>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span class="font-body-md text-body-md">Panel Control</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined">menu_book</span>
                    <span class="font-body-md text-body-md">Libros</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined">group</span>
                    <span class="font-body-md text-body-md">Usuarios</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-primary dark:text-primary-fixed-dim font-bold border-r-4 border-primary bg-surface-container-low transition-colors duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">handshake</span>
                    <span class="font-body-md text-body-md">Préstamos</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined">payments</span>
                    <span class="font-body-md text-body-md">Recargos</span>
                </a>
            </li>
        </ul>
        <!-- Footer Links -->
        <div class="mt-auto border-t border-outline-variant pt-4">
            <ul class="space-y-1">
                <li>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                        href="#">
                        <span class="material-symbols-outlined">settings</span>
                        <span class="font-body-md text-body-md">Ajustes</span>
                    </a>
                </li>
                <li>
                    <a class="flex items-center gap-3 px-3 py-2 rounded-lg text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors duration-200 ease-in-out"
                        href="#">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="font-body-md text-body-md">Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <!-- Main Content Area -->

</html>
